name: Scraper Pipeline

on:
  schedule:
    # Runs at 06:00 UTC on Monday and Thursday
    - cron: '0 6 * * 1,4'
  workflow_dispatch:
    inputs:
      city:
        description: 'City to scrape'
        required: true
        default: 'madrid'
        type: choice
        options:
          - madrid
          - barcelona

jobs:
  scrape-idealista:
    runs-on: ubuntu-latest
    timeout-minutes: 240

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Run Idealista scraper
        env:
          XHR_API_KEY: ${{ secrets.XHR_API_KEY }}
          SUPABASE_PROD_URL: ${{ secrets.SUPABASE_PROD_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          RESEND_API_KEY: ${{ secrets.RESEND_API_KEY }}
        run: |
          npx ts-node --project scripts/data-pipeline/tsconfig.json \
            scripts/data-pipeline/fetch-idealista.ts \
            --headless --city ${{ github.event.inputs.city || 'madrid' }}

