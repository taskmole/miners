name: Scraper Pipeline

on:
  schedule:
    # Rentals + SReality: Monday and Thursday at 06:00 UTC
    - cron: '0 6 * * 1,4'
    # Transfers: Tuesday and Friday at 06:00 UTC (separate day to avoid
    # Idealista rate-limiting after the rental scrape)
    - cron: '0 6 * * 2,5'
  workflow_dispatch:
    inputs:
      scraper:
        description: 'Which scraper to run'
        required: true
        default: 'both'
        type: choice
        options:
          - idealista
          - idealista-rental
          - idealista-transfer
          - sreality
          - both
      city:
        description: 'City for Idealista scraper'
        required: false
        default: 'madrid'
        type: choice
        options:
          - madrid
          - barcelona
      dry_run:
        description: 'Dry run: scrape 20 listings and write nothing to the database'
        required: false
        default: false
        type: boolean

jobs:
  # Idealista rentals run in their own job so the 6h GitHub Actions hard cap
  # applies to rentals alone, not to rentals + transfers combined.
  scrape-idealista-rental:
    runs-on: ubuntu-latest
    timeout-minutes: 360
    if: >-
      (github.event_name == 'schedule' && github.event.schedule == '0 6 * * 1,4')
      || (github.event_name == 'workflow_dispatch' && (github.event.inputs.scraper == 'idealista' || github.event.inputs.scraper == 'idealista-rental' || github.event.inputs.scraper == 'both'))
    outputs:
      score_outcome: ${{ steps.score.outcome }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Scrape Idealista rentals
        env:
          BRIGHTDATA_CUSTOMER_ID: ${{ secrets.BRIGHTDATA_CUSTOMER_ID }}
          BRIGHTDATA_ZONE: ${{ secrets.BRIGHTDATA_ZONE }}
          BRIGHTDATA_PASSWORD: ${{ secrets.BRIGHTDATA_PASSWORD }}
          SUPABASE_PROD_URL: ${{ secrets.SUPABASE_PROD_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          RESEND_API_KEY: ${{ secrets.RESEND_API_KEY }}
        run: |
          npx ts-node --project scripts/data-pipeline/tsconfig.json \
            scripts/data-pipeline/fetch-idealista.ts \
            --headless --city ${{ github.event.inputs.city || 'madrid' }} \
            --mode rental --skip-report --stats-file /tmp/stats-rental.json \
            ${{ github.event.inputs.dry_run == 'true' && '--dry-run --limit 20' || '' }}

      - name: Upload rental stats artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: stats-rental
          path: /tmp/stats-rental.json
          if-no-files-found: ignore
          retention-days: 7

      # Scoring runs right after the scrape, not in the report job, so Madrid
      # listings get scored even when the combined report fails.
      # continue-on-error keeps a scoring failure from blocking the digest;
      # the scoring-status job at the end turns the run red instead.
      - name: Score listings with AI
        id: score
        if: success()
        continue-on-error: true
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC }}
          SUPABASE_PROD_URL: ${{ secrets.SUPABASE_PROD_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
        run: |
          npx ts-node --project scripts/data-pipeline/tsconfig.json \
            scripts/data-pipeline/score-listings.ts \
            --city ${{ github.event.inputs.city || 'madrid' }}

  # Transfers run on their own days (Tue+Fri) so Idealista's anti-bot systems
  # aren't already on alert from the rental scrape. `needs` + `always()` still
  # enforce sequential order for manual dispatch (scraper: idealista/both),
  # where both jobs' conditions can be true on the same run. On a normal
  # split-day schedule run, rental is skipped, which satisfies `needs`
  # immediately without actually blocking on it.
  scrape-idealista-transfer:
    runs-on: ubuntu-latest
    timeout-minutes: 360
    needs: scrape-idealista-rental
    if: >-
      always()
      && ((github.event_name == 'schedule' && github.event.schedule == '0 6 * * 2,5')
        || (github.event_name == 'workflow_dispatch' && (github.event.inputs.scraper == 'idealista' || github.event.inputs.scraper == 'idealista-transfer' || github.event.inputs.scraper == 'both')))
    outputs:
      score_outcome: ${{ steps.score.outcome }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Scrape Idealista transfers
        env:
          BRIGHTDATA_CUSTOMER_ID: ${{ secrets.BRIGHTDATA_CUSTOMER_ID }}
          BRIGHTDATA_ZONE: ${{ secrets.BRIGHTDATA_ZONE }}
          BRIGHTDATA_PASSWORD: ${{ secrets.BRIGHTDATA_PASSWORD }}
          SUPABASE_PROD_URL: ${{ secrets.SUPABASE_PROD_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          RESEND_API_KEY: ${{ secrets.RESEND_API_KEY }}
        run: |
          npx ts-node --project scripts/data-pipeline/tsconfig.json \
            scripts/data-pipeline/fetch-idealista.ts \
            --headless --city ${{ github.event.inputs.city || 'madrid' }} \
            --mode transfer --skip-report --stats-file /tmp/stats-transfer.json \
            ${{ github.event.inputs.dry_run == 'true' && '--dry-run --limit 20' || '' }}

      - name: Upload transfer stats artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: stats-transfer
          path: /tmp/stats-transfer.json
          if-no-files-found: ignore
          retention-days: 7

      # See the rental job: scoring lives next to the scrape, failures are
      # surfaced by the scoring-status job rather than blocking the digest.
      - name: Score listings with AI
        id: score
        if: success()
        continue-on-error: true
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC }}
          SUPABASE_PROD_URL: ${{ secrets.SUPABASE_PROD_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
        run: |
          npx ts-node --project scripts/data-pipeline/tsconfig.json \
            scripts/data-pipeline/score-listings.ts \
            --city ${{ github.event.inputs.city || 'madrid' }}

  # Report + digest email runs after this workflow's Idealista job(s) finish.
  # Rentals and transfers now run on separate scheduled days (see above), so
  # on a normal schedule run only one of the two stats artifacts exists —
  # this job downloads whichever is present (missing ones are skipped, not
  # an error) and sends a report/digest for it. Runs even if one scraper
  # failed, as long as at least one produced data.
  idealista-report:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    needs: [scrape-idealista-rental, scrape-idealista-transfer]
    if: >-
      always()
      && (needs.scrape-idealista-rental.result == 'success'
        || needs.scrape-idealista-transfer.result == 'success')

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Download rental stats artifact
        continue-on-error: true
        uses: actions/download-artifact@v4
        with:
          name: stats-rental
          path: /tmp/

      - name: Download transfer stats artifact
        continue-on-error: true
        uses: actions/download-artifact@v4
        with:
          name: stats-transfer
          path: /tmp/

      - name: Send combined report
        env:
          RESEND_API_KEY: ${{ secrets.RESEND_API_KEY }}
        run: |
          npx ts-node --project scripts/data-pipeline/tsconfig.json \
            scripts/data-pipeline/send-combined-report.ts \
            --stats /tmp/stats-rental.json --stats /tmp/stats-transfer.json

      - name: Send Idealista digest email
        if: success()
        env:
          APP_URL: ${{ secrets.APP_URL }}
          DIGEST_SECRET: ${{ secrets.DIGEST_SECRET }}
          CITY: ${{ github.event.inputs.city || 'madrid' }}
        run: |
          curl -X POST "$APP_URL/api/send-digest" \
            -H "x-digest-secret: $DIGEST_SECRET" \
            -H "Content-Type: application/json" \
            -d "{\"source\":\"idealista\",\"city\":\"$CITY\"}" \
            --fail --silent --show-error

  scrape-sreality:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    if: >-
      (github.event_name == 'schedule' && github.event.schedule == '0 6 * * 1,4')
      || (github.event_name == 'workflow_dispatch' && (github.event.inputs.scraper == 'sreality' || github.event.inputs.scraper == 'both'))
    outputs:
      score_outcome: ${{ steps.score.outcome }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Run Sreality scraper
        env:
          SUPABASE_PROD_URL: ${{ secrets.SUPABASE_PROD_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          RESEND_API_KEY: ${{ secrets.RESEND_API_KEY }}
        run: |
          npx ts-node --project scripts/data-pipeline/tsconfig.json \
            scripts/data-pipeline/fetch-sreality.ts \
            --headless --url "${{ secrets.SREALITY_SEARCH_URL }}" --city prague

      # continue-on-error: scoring failures must never block the digest email.
      # The scoring-status job below still fails the run so it is not silent.
      - name: Score listings with AI
        id: score
        if: success()
        continue-on-error: true
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC }}
          SUPABASE_PROD_URL: ${{ secrets.SUPABASE_PROD_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
        run: |
          npx ts-node --project scripts/data-pipeline/tsconfig.json \
            scripts/data-pipeline/score-listings.ts \
            --city prague

      - name: Send Sreality digest email
        if: success()
        env:
          APP_URL: ${{ secrets.APP_URL }}
          DIGEST_SECRET: ${{ secrets.DIGEST_SECRET }}
        run: |
          curl -X POST "$APP_URL/api/send-digest" \
            -H "x-digest-secret: $DIGEST_SECRET" \
            -H "Content-Type: application/json" \
            -d '{"source":"sreality","city":"prague"}' \
            --fail --silent --show-error

  # Turns the whole run red if any scoring step failed. Scoring is allowed to
  # fail without blocking scrapes or digests, but it must not fail silently —
  # a broken scoring step went unnoticed for three weeks because the run
  # stayed green. Skipped jobs report an empty outcome and are ignored.
  scoring-status:
    runs-on: ubuntu-latest
    needs: [scrape-idealista-rental, scrape-idealista-transfer, scrape-sreality]
    if: always()

    steps:
      - name: Fail if any scoring step failed
        env:
          RENTAL: ${{ needs.scrape-idealista-rental.outputs.score_outcome }}
          TRANSFER: ${{ needs.scrape-idealista-transfer.outputs.score_outcome }}
          SREALITY: ${{ needs.scrape-sreality.outputs.score_outcome }}
        run: |
          failed=""
          if [ "$RENTAL" = "failure" ]; then failed="$failed idealista-rental"; fi
          if [ "$TRANSFER" = "failure" ]; then failed="$failed idealista-transfer"; fi
          if [ "$SREALITY" = "failure" ]; then failed="$failed sreality"; fi

          if [ -n "$failed" ]; then
            echo "::error::AI scoring failed for:$failed - open those jobs and read the 'Score listings with AI' step"
            exit 1
          fi

          echo "Scoring outcomes - rental: ${RENTAL:-skipped}, transfer: ${TRANSFER:-skipped}, sreality: ${SREALITY:-skipped}"
