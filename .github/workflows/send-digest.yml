name: Send Property Digest

on:
  # Fires automatically after the Scraper Pipeline workflow completes.
  # The name below must exactly match the "name:" field in scraper-pipeline.yml.
  workflow_run:
    workflows: ["Scraper Pipeline"]
    types: [completed]
  # Manual trigger from GitHub Actions UI
  workflow_dispatch:

jobs:
  send-digest:
    runs-on: ubuntu-latest
    if: >-
      github.event_name == 'workflow_dispatch'
      || github.event.workflow_run.conclusion == 'success'
    steps:
      - name: Trigger digest email
        run: |
          curl -X POST "${{ secrets.APP_URL }}/api/send-digest" \
            -H "x-digest-secret: ${{ secrets.DIGEST_SECRET }}" \
            -H "Content-Type: application/json" \
            --fail --silent --show-error
