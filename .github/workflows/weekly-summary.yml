name: Send Weekly Summary

# Manual test send only. The real Friday send is a Vercel cron (vercel.json),
# because GitHub's timers ran hours late and the summary arrived at 8:30pm.
#
# "Run workflow" sends immediately to the super admins, skipping the Friday
# window and the "already sent" check.
on:
  workflow_dispatch:

jobs:
  send-weekly-summary:
    runs-on: ubuntu-latest
    steps:
      - name: Trigger weekly summary email
        env:
          APP_URL: ${{ secrets.APP_URL }}
          DIGEST_SECRET: ${{ secrets.DIGEST_SECRET }}
        run: |
          curl -X POST "$APP_URL/api/send-weekly-summary" \
            -H "x-digest-secret: $DIGEST_SECRET" \
            --fail --silent --show-error
